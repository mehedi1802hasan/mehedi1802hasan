<svg xmlns="http://www.w3.org/2000/svg" width="830" height="60" viewBox="0 0 830 60" role="img" aria-label="certifications &amp; courses"><title>certifications &amp; courses</title>
<defs>
  <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#A3E635" stop-opacity="0.9"/><stop offset="1" stop-color="#A3E635" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  .ttl{animation:ttl .7s .1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes ttl{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="6.5" width="829" height="47" rx="12" fill="#0d1117" stroke="#21262d"/>
<g class="ttl"><text x="28" y="37" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700"><tspan fill="#A3E635">// </tspan><tspan fill="#e6edf3">certifications &amp; courses</tspan></text></g>
<rect class="grow" x="403.8" y="29.5" width="372.2" height="1.5" rx="1" fill="url(#ln)"/>
<circle class="pulse" cx="802" cy="30" r="4" fill="#A3E635"/></svg>
