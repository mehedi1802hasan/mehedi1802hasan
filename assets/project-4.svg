<svg xmlns="http://www.w3.org/2000/svg" width="410" height="220" viewBox="0 0 410 220" role="img" aria-label="Media Portal: News, live radio and shows in a single content-rich portal with API-driven data."><title>Media Portal: News, live radio and shows in a single content-rich portal with API-driven data.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#101b0a"/></linearGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect width="410" height="220" rx="18"/></clipPath>
</defs>
<style>
  .comet{stroke-dasharray:130 870;animation:comet 7s linear infinite;animation-delay:-6s}
  @keyframes comet{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
  .sweep{animation:sweep 8s ease-in-out infinite;animation-delay:-6s}
  @keyframes sweep{0%{transform:translateX(-120px)}35%,100%{transform:translateX(560px)}}
  .blk{animation:blk 2.8s ease-in-out infinite}
  @keyframes blk{0%,100%{opacity:.55}50%{opacity:1}}
  .drift{animation:drift 4s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateY(-8px)}50%{transform:translateY(14px)}}
  .btn{animation:btn 1.8s ease-in-out infinite}
  @keyframes btn{0%,100%{opacity:1}50%{opacity:.5}}
  .float2{animation:float2 3.4s ease-in-out infinite}
  @keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1s ease-in-out infinite alternate}
  @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
  .blinkd{animation:btn 1.2s ease-in-out infinite}
  .in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
