  <text x="244" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">Booking, order &amp; subscription UI for a US salon SaaS platform.</text>
