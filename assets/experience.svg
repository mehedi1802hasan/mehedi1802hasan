  <text x="244" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">Shopware 6, Shopify &amp; WordPress storefronts for European brands.</text>
  <rect x="733" y="22" width="69" height="22" rx="11" fill="#A3E635" />
  <text x="767.5" y="37" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" letter-spacing="1" fill="#0d1117">CURRENT</text>
</g>
