  <text x="244" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">MERN stack development.</text>
  <rect x="712" y="196" width="90" height="22" rx="11" fill="#161b22" stroke="#30363d"/>
  <text x="757" y="211" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" letter-spacing="1" fill="#8b949e">INTERNSHIP</text>
