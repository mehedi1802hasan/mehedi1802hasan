<svg xmlns="http://www.w3.org/2000/svg" width="830" height="258" viewBox="0 0 830 258" role="img" aria-label="Experience: Horizon Plus (2025 to now), Niibu Inc (2024-2025), F.A. Creative Firm (2023-2024), B2World (2023)"><title>Experience: Horizon Plus (2025 to now), Niibu Inc (2024-2025), F.A. Creative Firm (2023-2024), B2World (2023)</title>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#fff" opacity="0.07"/></pattern></defs>
<style>
  .in{animation:in .6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
  .draw{stroke-dasharray:1;animation:draw 1.4s .1s ease-out both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
  @keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="829" height="257" rx="18" fill="#0d1117" stroke="#21262d"/>
<rect x="0.5" y="0.5" width="829" height="257" rx="18" fill="url(#dots)"/>
<line class="draw" pathLength="1" x1="214" y1="34" x2="214" y2="208" stroke="#30363d" stroke-width="2"/>

<g class="in" style="animation-delay:0.25s">
  <text x="28" y="38" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing=".5" fill="#A3E635">MAY 2025 → NOW</text>
  <circle class="ring" cx="214" cy="34" r="6" fill="none" stroke="#A3E635" stroke-width="2"/>
